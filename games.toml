# The games this checkout plays. `tinybrains` looks for `games.toml` in the working directory first,
# so a clone needs no environment variable and no other repository beside it.
#
# Ants is a PINNED RELEASE: its artifact set -- the component, cartridge.json, the boards, the
# reference observations and the viewer -- as one archive on a GitHub release of Tiny-Brains/ants.
# `tinybrains` downloads it once into its cache and refuses it unless the archive hashes to
# `artifacts.sha256` and the component inside to `engine`, which is the digest the ladder plays.
# A new engine is a new release (its notes print this block) and a new block here.
#
# To play a local cartridge build instead, point TINYBRAINS_REGISTRY at a registry whose entry is
# `path = "<ants checkout>/dist"`. `tinybrains games` always reports which way it resolved.

[games.ants]
name = "Ants"
repo = "Tiny-Brains/ants"
release = "engine-cd656bc84c1a"
artifacts = { file = "ants-artifacts.tar.gz", sha256 = "sha256:290889f24482e565e32e1d6c470b305e3b1f38418df5b638a2b6e25323396ec6" }
engine = "sha256:cd656bc84c1accec25106c035dece8cdac211e1e0f1a5aa6a2e7836c1cfc3bb4"
