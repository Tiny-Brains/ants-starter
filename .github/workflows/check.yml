# Check every push the way admission will, and play a match.
#
# Copied from drill's workflow. The habit it builds is the point: an adapter change nobody meant
# to make is invisible until a ladder match loses to it, and a fixed seed on every commit is how
# it becomes visible on the commit that caused it.
#
# The four checkouts are the pre-release cost. `actions/checkout` cannot write outside the
# workspace, so this repository is checked out as a subdirectory and its siblings beside it,
# which is the layout `games.toml` expects. When Ants cuts a release and the CLI is installable
# from git, all of this collapses to a checkout and a `cargo install --git`.
name: check

on: [push, pull_request]

defaults:
  run:
    working-directory: starter

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: starter }
      - uses: actions/checkout@v4
        with: { repository: Tiny-Brains/ants, path: ants }
      - uses: actions/checkout@v4
        with: { repository: Tiny-Brains/devops, path: devops }
      - uses: actions/checkout@v4
        with: { repository: Tiny-Brains/axon, path: axon }

      - uses: dtolnay/rust-toolchain@stable
      - name: Install the CLI
        run: cargo install --path ../devops/cli

      # Admission's own two calls over the game's reference observations: the graph's operators
      # and shapes, the adapter's worst operation count against the budget, the slowest inference.
      - name: Check it the way admission will
        run: tinybrains check model.onnx adapter.json

      # A whole match through the real engine, so an adapter that returns but plays nothing is
      # caught here and not on the ladder.
      - name: Play it against itself
        run: tinybrains matches/self-play.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replays
          path: starter/replays/
