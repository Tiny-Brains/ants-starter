# Check every push the way admission will, and play a match.
#
# Copied from drill's workflow. The habit it builds is the point: an adapter change nobody meant
# to make is invisible until a ladder match loses to it, and a fixed seed on every commit is how
# it becomes visible on the commit that caused it.
#
# One checkout and one install. `games.toml` pins the Ants release, so the first `tinybrains` call
# downloads the cartridge and checks it against the two digests there; nothing else is cloned.
name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - name: Install the CLI
        run: cargo install --locked --git https://github.com/Tiny-Brains/devops tinybrains

      # Admission's own two calls over the game's reference observations: the graph's operators
      # and shapes, the adapter's worst operation count against the budget, the slowest inference.
      - name: Check it the way admission will
        run: tinybrains check model.onnx manifest.json

      # A whole match through the real engine, so an adapter that returns but plays nothing is
      # caught here and not on the ladder.
      - name: Play it against itself
        run: tinybrains matches/self-play.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replays
          path: replays/
